services:
  - type: web
    name: shared-backend
    runtime: node
    rootDir: shared-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 20
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_SECRET
        sync: false
      # REQUIRED in production (Render sets NODE_ENV=production).
      - key: SESSION_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        # "*" allows every origin (the server treats a literal * as allow-all).
        # Replace with your exact Vercel URLs once they are final, e.g.
        # https://gov-portal-xxxx.vercel.app,https://vet-registration-xxxx.vercel.app
        value: "*"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: B2_APPLICATION_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
      # Render Free blocks outbound SMTP (ports 25/465/587). "auto" uses
      # Brevo/Resend over HTTPS when their API key is set, then falls back to
      # SMTP (works on paid Render plans), then to console logging.
      - key: MAIL_MODE
        value: auto
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Recommended on Render Free — both use HTTPS (port 443).
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: OTP_PAGE
        value: false
